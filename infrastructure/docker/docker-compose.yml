version: '3.9'

services:
  voice-agent:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    environment:
      - NODE_ENV=production
      - PORT=8080
    networks:
      - platform-network

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - DASHBOARD_API_PORT=3001
    networks:
      - platform-network

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api:3001
    depends_on:
      - api
    networks:
      - platform-network

networks:
  platform-network:
    driver: bridge
